<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MES系统 - 登录</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <h2>MES制造执行系统</h2>
    <div class="form-item">
      <label>账号</label>
      <input id="username" placeholder="请输入账号">
    </div>
    <div class="form-item">
      <label>密码</label>
      <input id="password" type="password" placeholder="请输入密码">
    </div>
    <button class="btn" onclick="doLogin()">登录系统</button>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
