<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>MES-生产工单</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <div class="sidebar">
    <div class="sidebar-header">MES制造系统</div>
    <div class="sidebar-menu">
      <a href="index.html">仪表盘</a>
      <a href="production.html" class="active">生产工单</a>
      <a href="equipment.html">设备管理</a>
      <a href="material.html">物料管理</a>
      <a href="quality.html">品质检验</a>
      <a href="login.html">退出登录</a>
    </div>
  </div>
  <div class="main-container">
    <div class="header-bar">
      <div>生产工单管理</div>
      <div>管理员</div>
    </div>
    <div class="content">
      <div class="card">
        <div class="card-title">工单列表</div>
        <table>
          <thead>
            <tr>
              <th>工单号</th>
              <th>产品</th>
              <th>计划数</th>
              <th>完工数</th>
              <th>开工时间</th>
              <th>状态</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>WO2026093001</td>
              <td>壳体组件A</td>
              <td>5000</td>
              <td>3200</td>
              <td>2026-09-30 08:00</td>
              <td><span class="tag-warning">生产中</span></td>
            </tr>
            <tr>
              <td>WO2026093002</td>
              <td>支架B</td>
              <td>2000</td>
              <td>2000</td>
              <td>2026-09-29 14:00</td>
              <td><span class="tag-success">已完成</span></td>
            </tr>
            <tr>
              <td>WO2026093003</td>
              <td>盖板C</td>
              <td>1200</td>
              <td>0</td>
              <td>2026-10-01 09:00</td>
              <td><span class="tag-danger">待开工</span></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
